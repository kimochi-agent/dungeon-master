name: Request Unity activation file

# One-time helper: run this manually (Actions tab > Run workflow), download the
# .alf artifact, upload it at https://license.unity3d.com/manual, and save the
# returned .ulf file content as the UNITY_LICENSE repository secret.
# See docs/android-build.md ("GitHub Actions" section) for the full steps.
on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        uses: game-ci/unity-request-activation@v2
        id: getActivationFile
        with:
          unityVersion: 6000.6.7f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getActivationFile.outputs.filePath }}
