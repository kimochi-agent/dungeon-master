name: Build Android APK

# Builds DungeonMaster.apk with Unity 6000.6.7f1 on every push that touches
# the game (plus manual runs). The APK is uploaded as a run artifact.
on:
  push:
    branches: ["**"]
    paths:
      - "game/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build DungeonMaster.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Unity Android builds are big; stock runners run out of disk without this.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: game/Dungeon-Master/Library
          key: unity-library-android-6000.6.7f1-${{ hashFiles('game/Dungeon-Master/Packages/manifest.json', 'game/Dungeon-Master/Packages/packages-lock.json', 'game/Dungeon-Master/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-android-6000.6.7f1-
            unity-library-android-

      - name: Build with Unity (game-ci)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game/Dungeon-Master
          unityVersion: 6000.6.7f1
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          androidVersionCode: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonMaster-apk
          path: game/Dungeon-Master/Builds/DungeonMaster.apk
          if-no-files-found: error
